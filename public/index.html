<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneDrive Cinema</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>OneDrive Cinema</h1>
      <div class="actions">
        <input id="searchInput" placeholder="Search videos, images, docs" />
        <button id="loginBtn">Connect OneDrive</button>
      </div>
    </header>

    <main>
      <section id="stats" class="stats"></section>
      <section id="grid" class="grid"></section>
    </main>

    <dialog id="previewModal" class="modal">
      <button id="closeModal" class="close">✕</button>
      <div id="previewBody"></div>
    </dialog>

    <template id="skeletonTemplate">
      <article class="card skeleton">
        <div class="thumb"></div>
        <div class="line"></div>
        <div class="line short"></div>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
